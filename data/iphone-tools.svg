<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a3c"/>
      <stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="0.55" stop-color="#5E5CE6"/>
      <stop offset="1" stop-color="#BF5AF2"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- side buttons -->
  <rect x="31" y="34" width="4" height="10" rx="2" fill="#2c2c2e"/>
  <rect x="31" y="50" width="4" height="16" rx="2" fill="#2c2c2e"/>
  <rect x="93" y="44" width="4" height="22" rx="2" fill="#2c2c2e"/>
  <!-- body -->
  <rect x="33" y="6" width="62" height="116" rx="16" fill="url(#body)" stroke="#5a5a5e" stroke-width="1.5"/>
  <!-- screen -->
  <rect x="38" y="11" width="52" height="106" rx="12" fill="url(#screen)"/>
  <!-- app icons -->
  <g fill="#fff" fill-opacity="0.85">
    <rect x="44" y="34" width="10" height="10" rx="3"/>
    <rect x="59" y="34" width="10" height="10" rx="3"/>
    <rect x="74" y="34" width="10" height="10" rx="3"/>
    <rect x="44" y="50" width="10" height="10" rx="3"/>
    <rect x="59" y="50" width="10" height="10" rx="3"/>
    <rect x="74" y="50" width="10" height="10" rx="3"/>
  </g>
  <rect x="42" y="96" width="44" height="13" rx="6" fill="#fff" fill-opacity="0.22"/>
  <!-- dynamic island + home bar -->
  <rect x="54" y="16" width="20" height="6" rx="3" fill="#000"/>
  <rect x="53" y="112" width="22" height="2.5" rx="1.25" fill="#fff" fill-opacity="0.75"/>
  <!-- gloss -->
  <path d="M38 23 Q38 11 50 11 L64 11 L46 117 L50 117 Q38 117 38 105 Z" fill="url(#gloss)"/>
